<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nettoyeur PC</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Nettoyeur PC</h1>
    <button id="scan">Scanner mon dossier personnel</button>
    <span id="resume">Aucun scan lancé.</span>
  </header>
  <p id="courant"></p>

  <div id="app" hidden>
    <main>
      <nav id="onglets">
        <button data-vue="unites" class="actif">Unités</button>
        <button data-vue="fichiers">Fichiers</button>
        <button data-vue="supprimer">À supprimer</button>
      </nav>
      <div id="filtres" class="encadre">
        <label>Genre
          <select id="genre">
            <option value="">Tout</option>
            <option value="projet">Projets</option>
            <option value="dossier">Dossiers</option>
            <option value="fichier">Fichiers</option>
          </select>
        </label>
        <label>Notes
          <select id="statut">
            <option value="">Toutes</option>
            <option value="non-notees">Non notées</option>
            <option value="notees">Notées</option>
          </select>
        </label>
        <label>Dans <input id="dans" type="search" placeholder="Downloads, Documents/PERSO…" autocomplete="off"></label>
      </div>
      <div id="suppression" class="encadre" hidden>
        <label>Noté
          <select id="seuil">
            <option value="1">1 étoile</option>
            <option value="2" selected>2 étoiles ou moins</option>
            <option value="3">3 étoiles ou moins</option>
          </select>
        </label>
        <span id="bilan"></span>
        <button id="vider" class="danger">Mettre à la Corbeille</button>
      </div>
      <p id="resultat" hidden></p>
      <div id="barre">
        <div id="fil"></div>
        <label id="option-tri">Trier par
          <select id="tri">
            <option value="taille">Taille</option>
            <option value="modifie">Date de modification</option>
            <option value="note">Note</option>
            <option value="type">Type</option>
            <option value="nom">Nom</option>
          </select>
        </label>
      </div>
      <table>
        <thead><tr><th>Nom</th><th>Type</th><th>Note</th><th class="num">Taille</th><th class="num">Modifié</th></tr></thead>
        <tbody id="liste"></tbody>
      </table>
      <p id="vide" hidden>Rien à afficher.</p>
      <p id="pied"><button id="suite" hidden>Afficher la suite</button></p>
    </main>
    <aside id="details"><p class="discret">Clique sur une ligne pour voir ses informations.</p></aside>
  </div>

  <script src="/app.js"></script>
</body>
</html>
