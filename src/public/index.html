<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nettoyeur PC</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Nettoyeur PC</h1>
    <button id="scan">Scanner mon dossier personnel</button>
    <span id="resume">Aucun scan lancé.</span>
  </header>
  <p id="courant"></p>

  <div id="app" hidden>
    <main>
      <nav id="onglets">
        <button data-vue="fichiers" class="actif">Fichiers</button>
        <button data-vue="projets">Projets</button>
      </nav>
      <div id="barre">
        <div id="fil"></div>
        <label>Trier par
          <select id="tri">
            <option value="taille">Taille</option>
            <option value="modifie">Date de modification</option>
            <option value="note">Note</option>
            <option value="type">Type</option>
            <option value="nom">Nom</option>
          </select>
        </label>
        <label id="option-imbriques" hidden><input type="checkbox" id="imbriques"> Sous-projets</label>
      </div>
      <table>
        <thead><tr><th>Nom</th><th>Type</th><th>Note</th><th class="num">Taille</th><th class="num">Modifié</th></tr></thead>
        <tbody id="liste"></tbody>
      </table>
      <p id="vide" hidden>Dossier vide.</p>
    </main>
    <aside id="details"><p class="discret">Clique sur une ligne pour voir ses informations.</p></aside>
  </div>

  <script src="/app.js"></script>
</body>
</html>
